{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Create Account — Caloriq</title>

    <link
        rel="stylesheet"
        href="{% static 'nutrition/css/style.css' %}"
    >

</head>


<body class="auth-page">


    <div class="auth-container">


        <!-- BRAND -->

        <div class="auth-brand">

            <a href="/" class="logo">

                <span class="logo-mark">✦</span>

                CALORIQ

            </a>

        </div>


        <!-- SIGN UP CARD -->

        <div class="auth-card">


            <p class="eyebrow">
                BEGIN YOUR JOURNEY
            </p>


            <h1>

                Create your
                <span>Caloriq account.</span>

            </h1>


            <p class="auth-subtitle">

                Your food, movement and progress —
                all in one place.

            </p>


            <form method="POST">

                {% csrf_token %}


                <!-- NAME -->

                <div class="auth-field">

                    <label for="username">
                        Username
                    </label>

                    <input
                        type="text"
                        id="username"
                        name="username"
                        placeholder="Choose a username"
                        required
                    >

                </div>


                <!-- EMAIL -->

                <div class="auth-field">

                    <label for="email">
                        Email
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="you@example.com"
                        required
                    >

                </div>


                <!-- PASSWORD -->

                <div class="auth-field">

                    <label for="password1">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password1"
                        name="password1"
                        placeholder="Create a password"
                        required
                    >

                </div>


                <!-- CONFIRM PASSWORD -->

                <div class="auth-field">

                    <label for="password2">
                        Confirm password
                    </label>

                    <input
                        type="password"
                        id="password2"
                        name="password2"
                        placeholder="Enter password again"
                        required
                    >

                </div>


                <button
                    type="submit"
                    class="auth-button"
                >

                    Create account →

                </button>

            </form>


            <div class="auth-divider">

                <span>or</span>

            </div>


            <p class="auth-switch">

                Already have an account?

                <a href="/login/">
                    Log in
                </a>

            </p>


        </div>


    </div>


</body>

</html>
